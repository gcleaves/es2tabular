[project]
name = "es2tabular"
version = "0.1.0"
description = "Query Elasticsearch through an es2tabular server and get a dataframe back"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "ISC" }
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
polars = ["polars>=1.0"]

[project.urls]
Homepage = "https://github.com/gcleaves/es2tabular"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["es2tabular"]
